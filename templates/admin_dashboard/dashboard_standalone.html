<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:"Admin Dashboard" }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-1: #0B1220;
            --bg-2: #111827;
            --surface-1: rgba(249, 250, 251, 0.04);
            --surface-2: rgba(249, 250, 251, 0.06);
            --card: rgba(26, 35, 51, 0.88);
            --card-strong: rgba(17, 24, 39, 0.96);
            --stroke: #2A3441;
            --stroke-soft: rgba(42, 52, 65, 0.82);
            --text: #F9FAFB;
            --muted: #9CA3AF;
            --accent: #F59E0B;
            --accent-2: #D97706;
            --accent-warm: #B45309;
            --accent-danger: #cf1f33;
            --accent-violet: #2A3441;
            --accent-blue: #1F2937;
            --text-soft: #D1D5DB;
            --text-faint: #94A3B8;
            --text-on-accent: #1F1405;
            --radius-sm: 0.7rem;
            --radius-md: 1rem;
            --radius-lg: 1.25rem;
            --shadow-soft: 0 18px 38px rgba(0, 0, 0, 0.22);
            --shadow-strong: 0 28px 60px rgba(0, 0, 0, 0.36);
            --easing-premium: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            background: var(--bg-1);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius-lg);
            margin-bottom: 30px;
            border: 1px solid var(--stroke);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stats-card {
            background: var(--card);
            padding: 25px;
            border-radius: var(--radius-md);
            border: 1px solid var(--stroke);
            transition: transform 0.3s ease;
        }

        .stats-card:hover {
            transform: translateY(-2px);
        }

        .stats-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .stats-label {
            color: var(--muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius-lg);
            margin-bottom: 30px;
            border: 1px solid var(--stroke);
        }

        canvas {
            max-height: 400px;
        }

        h1 {
            margin: 0;
            color: var(--text);
        }

        h3 {
            color: var(--text);
            margin-bottom: 20px;
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/theme-red-navy.css' %}?v=1">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Dashboard</h1>
        </div>
        
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-number">{{ total_orders|default:0 }}</div>
                <div class="stats-label">Total Orders</div>
            </div>
            <div class="stats-card">
                <div class="stats-number">₹{{ total_revenue|default:0 }}</div>
                <div class="stats-label">Total Revenue</div>
            </div>
            <div class="stats-card">
                <div class="stats-number">{{ total_products|default:0 }}</div>
                <div class="stats-label">Total Products</div>
            </div>
            <div class="stats-card">
                <div class="stats-number">{{ total_users|default:0 }}</div>
                <div class="stats-label">Total Users</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h3>Monthly Sales</h3>
            <canvas id="monthlySalesChart"></canvas>
        </div>
    </div>

    <script>
        // Test chart with static data
        const ctx = document.getElementById('monthlySalesChart');
        if (ctx) {
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Revenue',
                        data: [12000, 19000, 15000, 25000, 22000, 30000],
                        borderColor: '#F59E0B',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#9CA3AF'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#9CA3AF'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
