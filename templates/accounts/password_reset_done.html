{% extends 'base.html' %}
{% block title %}Reset Email Sent | Eyetrack Solutions{% endblock %}
{% block meta_robots %}noindex, nofollow{% endblock %}
{% block content %}
<section class="auth-wrap row justify-content-center">
    <div class="col-lg-5">
        <div class="glass-card p-4 p-md-5 text-center">
            <h1 class="h4 mb-3">Check your email</h1>
            <p class="text-secondary mb-4">If an account exists with that email, a password reset link has been sent.</p>
            <a href="{% url 'login' %}" class="btn btn-premium-cta">Return to Login</a>
        </div>
    </div>
</section>
{% endblock %}
